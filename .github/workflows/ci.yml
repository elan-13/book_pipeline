name: CI/CD Pipeline - Data Engineering Quality & Tests

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile pipeline/batch_pipeline.py
          python -m py_compile config/pipeline_config.py

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__
          # Exit-zero treats all errors as warnings. Max line-length 127
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,__pycache__

  test-matrix:
    name: Automated Tests (Python ${{ matrix.python-version }})
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Data Transformations)
        run: |
          pytest tests/test_transformations.py -v -m unit

      - name: Run Mock Tests (API & Database Boundaries)
        run: |
          pytest tests/test_mock_pipeline.py -v -m mock

      - name: Run Data Quality Gate Tests
        run: |
          pytest tests/test_data_quality.py -v -m quality

      - name: Run Full Test Suite with Coverage
        run: |
          pytest tests/ --junitxml=reports/test-results-${{ matrix.python-version }}.xml

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore

  pipeline-smoke-test:
    name: End-to-End Pipeline Smoke Test
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Local CI Runner
        run: |
          python run_ci.py
